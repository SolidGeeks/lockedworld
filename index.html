<meta name="theme-color" content="#0d0f0c">

<meta property="og:description" content="Libère la ville verrouillée par Lockware. Cinq niveaux, cinq façons de jouer.">

<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
<style>
/* Layout: arcade cabinet. Thin HUD strip, then a full-bleed canvas world with DOM overlays (stats, minimap, bubbles, menus). Single dark look by choice, Solid Geeks brand. */
:root{
  --bg:#0d0f0c; --bg2:#0b0d0a; --panel:#141711; --line:#2a2e25; --line2:#3a3f33;
  --fg:#eef1e8; --muted:#a2a898; --dim:#61685a;
  --lime:#c8f520; --ink:#0a0b09; --red:#ff5d4f; --amber:#ffb547;
  --display:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hud{display:flex;align-items:center;gap:14px;min-height:40px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap}
.logo svg{width:26px;height:22px;flex:none}
.obj{flex:1;min-width:0;font-family:var(--display);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj b{color:var(--lime);font-weight:700}
.timer{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--line2)}
.icon-btn svg{width:18px;height:18px}
#sound[aria-pressed="false"] .on-ic{display:none}
#sound[aria-pressed="true"] .off-ic{display:none}

#stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg2);container-type:size}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.aim{cursor:none}
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{pointer-events:auto}

.stats{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(250px,46cqw)}
.hp{height:10px;background:#1b1e17;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--lime);transform-origin:left;transition:transform .15s}
.hp.low i{background:var(--red)}
.row{display:flex;gap:14px;font-family:var(--display);font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:baseline}
.row b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.row .mult{color:var(--lime);font-weight:800;font-size:15px}
.crewbar{display:flex;gap:4px}
.crewbar span{width:30px;height:30px;border:1px solid var(--line);border-radius:3px;background:rgba(9,10,8,.8);padding:2px;opacity:.35;filter:grayscale(1);transition:opacity .4s,filter .4s,border-color .4s}
.crewbar span.on{opacity:1;filter:none;border-color:rgba(200,245,32,.6)}
.crewbar svg{width:100%;height:100%;display:block}
.mini{position:absolute;right:12px;top:12px;width:min(190px,34cqw);aspect-ratio:36/26;border:1px solid var(--line2);border-radius:3px;background:rgba(9,10,8,.85);pointer-events:none}
.mini canvas{width:100%;height:100%;display:block}
.touch{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.touch button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line2);background:rgba(9,10,8,.7);font-family:var(--display);font-size:11px;font-weight:700;touch-action:none}
.touch button.ready{border-color:var(--lime);color:var(--lime)}
@media (hover:hover) and (pointer:fine){.touch{display:none}}

.bubble{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;max-width:min(560px,calc(100% - 24px));display:flex;gap:10px;align-items:center;background:rgba(9,10,8,.94);border:1px solid var(--line2);border-left:3px solid var(--lime);border-radius:4px;padding:8px 14px 8px 8px;animation:rise .2s ease-out;pointer-events:none;z-index:4}
.bubble svg{width:42px;height:42px;flex:none}
.bubble b{display:block;font-family:var(--display);font-size:12px;color:var(--lime);letter-spacing:.06em}
.bubble span{font-size:14px;line-height:1.4}
.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(9,10,8,.92);border:1px solid var(--lime);border-radius:4px;padding:14px 26px;box-shadow:0 0 50px rgba(200,245,32,.18);animation:pop .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:5;display:flex;gap:14px;align-items:center;max-width:calc(100% - 24px)}
.toast svg{width:52px;height:52px;flex:none}
.toast .k{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.toast .t{font-family:var(--display);font-weight:800;font-size:clamp(18px,3.4cqh,26px);color:var(--lime)}
.toast .d{font-size:13px}
.lcard{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;background:rgba(9,10,8,.9);z-index:6;padding:24px;animation:fade .3s ease-out}
.lcard .n{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.lcard h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,7cqh,58px);margin:0;letter-spacing:-.03em;text-wrap:balance;max-width:18ch;line-height:1.02}
.lcard .tag{font-family:var(--display);font-size:13px;color:var(--lime)}
.lcard svg{width:64px;height:64px}
.out{opacity:0;transition:opacity .3s}
@keyframes rise{from{transform:translate(-50%,8px);opacity:0}}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
@keyframes fade{from{opacity:0}}

.menu{position:absolute;inset:0;overflow:auto;display:grid;align-items:center;padding:clamp(16px,4cqh,40px) clamp(16px,4cqw,48px);background:linear-gradient(90deg,rgba(13,15,12,.97) 0%,rgba(13,15,12,.86) 55%,rgba(13,15,12,.4) 100%);z-index:8;user-select:text}
.menu.center{justify-items:center;text-align:center;background:rgba(9,10,8,.88)}
.m-in{max-width:640px;display:flex;flex-direction:column;gap:16px;min-width:0}
.m-in.wide{max-width:860px}
.menu.center .m-in{align-items:center}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em}
.eyebrow svg{width:22px;height:22px}
.menu h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,8cqh,78px);line-height:.95;letter-spacing:-.04em;margin:0;text-wrap:balance}
.menu h1 .cur{color:var(--lime);animation:blink 1s steps(1) infinite}
.menu h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,7cqh,56px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.menu h2 em{font-style:normal;color:var(--lime)}
@keyframes blink{50%{opacity:0}}
.lede{font-size:clamp(14px,2.3cqh,17px);line-height:1.55;color:var(--muted);margin:0;max-width:58ch}
.lede b{color:var(--fg);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;color:var(--muted);margin:0;text-align:left}
.keys dt{font-family:var(--display);color:var(--fg);white-space:nowrap}
.keys dd{margin:0}
kbd{font-family:var(--display);font-size:.85em;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--fg)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.menu.center .acts{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;min-height:46px;padding:10px 20px;border-radius:3px;border:1px solid var(--lime);background:var(--lime);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{background:#d6ff3e}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
.opts{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:32px}
.opts input{accent-color:var(--lime);width:16px;height:16px}
.levels{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lv{width:100%;height:100%;display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px;border:1px solid var(--line2);border-radius:4px;background:rgba(20,23,17,.85);cursor:pointer;transition:border-color .15s,transform .12s}
.lv:hover:not(:disabled){border-color:var(--lime);transform:translateY(-2px)}
.lv:disabled{opacity:.38;cursor:not-allowed}
.lv.done{border-color:rgba(200,245,32,.45)}
.lv .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lv .num{font-family:var(--display);font-weight:800;font-size:20px;color:var(--lime)}
.lv svg{width:32px;height:32px}
.lv b{font-size:13px;font-weight:600;line-height:1.25}
.lv .tg{font-family:var(--display);font-size:11px;color:var(--muted);line-height:1.3}
.lv .bs{font-family:var(--display);font-size:11px;color:var(--dim);margin-top:auto;padding-top:4px}
.lv.done .bs{color:var(--lime)}
.endstats{display:flex;gap:22px;flex-wrap:wrap;margin:0;justify-content:center}
.endstats div{display:flex;flex-direction:column}
.endstats dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-family:var(--display)}
.endstats dd{margin:0;font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.perk{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid rgba(200,245,32,.45);border-radius:4px;padding:10px 14px;background:rgba(200,245,32,.05);max-width:460px}
.perk svg{width:48px;height:48px;flex:none}
.perk b{font-family:var(--display);color:var(--lime);display:block}
.perk span{font-size:14px;color:var(--muted)}

.face{display:block}
.face .l{fill:var(--lime)} .face .ls{stroke:var(--lime)} .face .w{fill:var(--fg)} .face .ws{stroke:var(--fg)}
.face .head{fill:#1f231b;stroke:#3d4236;stroke-width:1.5} .face .body{fill:#151812;stroke:#2c3027;stroke-width:1.5}
.face .hood{fill:#121410;stroke:#2c3027;stroke-width:1.5} .face .dk{fill:#060705} .face .mt{stroke:#6f7667} .face .fs{stroke:#c9cdc1}
.face .ct{fill:#2b2f27} .face .cr{fill:#171a14} .face .gr{fill:#2a2e25} .face .lk{fill:#2b2e28;stroke:#5c6255;stroke-width:3} .face .lks{stroke:#5c6255}

@media (max-width:820px){ .levels{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:720px){
  .logo span,.obj{display:none}
  .hud{justify-content:space-between}
  .levels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .keys{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="app">
  <header class="hud">
    <div class="logo" aria-label="Solid Geeks">
      <svg viewBox="0 0 26 22" aria-hidden="true"><path d="M8 2H5v7l-3 2 3 2v7h3M18 2h3v7l3 2-3 2v7h-3M13 4v14" fill="none" stroke="#c8f520" stroke-width="2.6"/></svg>
      <span>solid geeks</span>
    </div>
    <div class="obj" id="obj" aria-live="polite">The Locked World</div>
    <div class="timer" id="timer" role="timer" aria-label="Temps du niveau">00:00</div>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
    <button class="icon-btn" id="sound" aria-pressed="true" aria-label="Couper le son">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on-ic" d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/><path class="off-ic" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="cv" aria-label="Monde du jeu"></canvas>
    <div class="ov" id="hudov" hidden>
      <div class="stats">
        <div class="hp" id="hp" role="meter" aria-label="Points de vie"><i></i></div>
        <div class="row"><span>score <b id="score">0</b></span><span class="mult" id="mult"></span><span>commits <b id="commits">0</b></span></div>
        <div class="crewbar" id="crewbar"></div>
      </div>
      <div class="mini"><canvas id="mini" width="360" height="260"></canvas></div>
      <div class="touch"><button id="tTur" aria-label="Poser une tourelle">TOUR</button><button id="tDash" aria-label="Esquive">DASH</button></div>
    </div>
    <div class="ov" id="fx"></div>
    <div class="ov" id="menu"></div>
  </main>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d'), fx = $('#fx'), menu = $('#menu');
const mini = $('#mini'), mctx = mini.getContext('2d');
const C = { bg:'#0d0f0c', fg:'#eef1e8', muted:'#a2a898', dim:'#61685a', line:'#2a2e25', lime:'#c8f520', red:'#ff5d4f', amber:'#ffb547', blue:'#8fd3ff', violet:'#c49bff' };
const la = a => `rgba(200,245,32,${a})`;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
const LINKS = { site:'https://solidgeeks.github.io/SolidGeeks/', discord:'https://discord.gg/F9g5YFBzwY', github:'https://github.com/0b3l1X-SolidGeeks' };
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
const COARSE = matchMedia('(pointer: coarse)');
let RM = RMQ.matches;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const dist = (a,b) => Math.hypot(a.x - b.x, a.y - b.y);
const pickW = list => { let s = 0; for (const [,w] of list) s += w; let r = Math.random()*s; for (const [v,w] of list){ r -= w; if (r <= 0) return v; } return list[0][0]; };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const live = t => { $('#live').textContent = t; };
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s)%60).padStart(2,'0')}`;

/* ================= audio ================= */
let AC = null, master = null, noiseBuf = null, muted = false;
function ac(){
  if (!AC){ try {
    AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : .55; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  } catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d=.08, type='square', v=.05, when=0, slide=0){
  if (!AC || muted) return;
  const t = AC.currentTime + Math.max(0,when), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
}
function noise(d=.2, v=.1, freq=900){
  if (!AC || muted) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
let lastShot = 0;
const sfx = {
  shot(){ const n = performance.now(); if (n - lastShot < 55) return; lastShot = n; tone(1400, .05, 'square', .014, 0, .45); },
  hit(){ tone(300, .04, 'square', .02, 0, .7); },
  ping(){ tone(2200, .04, 'triangle', .02); },
  kill(){ noise(.18, .09, 1800); tone(220, .12, 'square', .03, 0, .4); },
  hurt(){ noise(.15, .12, 600); tone(140, .2, 'sawtooth', .05, 0, .5); },
  pick(){ tone(1200 + Math.random()*400, .04, 'triangle', .03); },
  dash(){ noise(.12, .05, 3000); },
  boom(){ noise(.7, .2, 1200); tone(60, .7, 'sawtooth', .08, 0, .4); },
  eshot(){ tone(500, .06, 'triangle', .012, 0, .6); },
  blink(){ tone(1800, .08, 'sine', .03, 0, .3); },
  chime(){ [523,659,784,1047].forEach((f,i) => tone(f, .16, 'triangle', .06, i*.07)); },
  fanfare(){ [392,523,659,784,659,784,1047].forEach((f,i) => tone(f, i === 6 ? .6 : .14, 'square', .045, i*.11)); },
  alarm(){ for (let i = 0; i < 3; i++){ tone(880, .1, 'square', .035, i*.24); tone(620, .1, 'square', .035, i*.24 + .12); } },
  siren(){ tone(700, .35, 'sawtooth', .025, 0, 1.4); },
  blip(p){ tone(p, .04, 'square', .02); },
};
const music = {
  id:null, step:0, next:0, intense:false,
  start(){
    if (this.id || !AC) return;
    const bass = [55,55,65.4,49], arp = [440,523,659,784,659,523,440,392];
    const sd = 60/128/2; this.next = AC.currentTime + .05;
    this.id = setInterval(() => {
      if (!AC) return;
      if (muted || game.state !== 'play'){ this.next = AC.currentTime + .05; return; }
      while (this.next < AC.currentTime + .25){
        const s = this.step % 16, w = this.next - AC.currentTime, bar = (this.step >> 4) % 4;
        tone(bass[bar]*(s % 2 ? 2 : 1), .16, 'square', .022, w);
        if (s % 4 === 0) noise(.05, .03, 4000);
        if (this.intense || s % 2 === 0) tone(arp[(s + bar*2) % 8]*(bar === 3 ? .89 : 1), .1, 'triangle', .011, w);
        this.next += sd; this.step++;
      }
    }, 80);

function addOb(o){

}

const obsNear = (x, y) => hash.get(Math.floor(x/CELL) + ',' + Math.floor(y/CELL)) || [];

}
const wallAt = (x, y) => { for (const o of obsNear(x, y)) if (hitsOb(o, x, y, 0)) return true; return false; };

    if (o.t === 'r'){

function startBoss(cx, cy, rx){
  music.intense = true;
  game.boss = { x:cx, y:cy, cx, cy, rx, r:62, hp:560, max:560, t:0, ring:2, spiral:0, burst:2, phase:1, flash:0 };
  sfx.alarm(); shake(10, .5);
}
function updateBoss(dt){
  const B = game.boss; if (!B || B.hp <= 0) return;
  B.t += dt; B.flash = Math.max(0, B.flash - dt);
  B.x = B.cx + Math.sin(B.t*.5)*B.rx; B.y = B.cy + Math.sin(B.t*.9)*50;
  const pr = B.hp/B.max, ph = pr > .66 ? 1 : pr > .33 ? 2 : 3;
  if (ph !== B.phase){ B.phase = ph; sfx.alarm(); shake(8, .4); bubble('lock', ph === 2 ? 'Licence révoquée. Activation des agents de conformité.' : 'Mode verrouillage total.', 2600);
    for (let i = 0; i < (ph === 2 ? 4 : 6); i++) spawnEnemy(i % 2 ? 'drone' : 'bug', B.x + (Math.random()-.5)*300, B.y + 180); }
  B.ring -= dt;
  if (B.ring <= 0){ B.ring = ph === 1 ? 1.9 : ph === 2 ? 2.3 : 1.7; const n = ph === 3 ? 22 : 18, off = Math.random()*6.28; for (let i = 0; i < n; i++){ if (i % 6 === 0) continue; eFire(B.x, B.y, off + i/n*6.283, 210, 12, 7); } sfx.eshot(); }
  if (ph >= 2){ B.spiral -= dt; if (B.spiral <= 0){ B.spiral = ph === 2 ? .12 : .09; const a = B.t*2.4; eFire(B.x, B.y, a, 240, 10, 5); eFire(B.x, B.y, a + Math.PI, 240, 10, 5); } }
  if (ph === 3){ B.burst -= dt; if (B.burst <= 0){ B.burst = 1.5; const a = Math.atan2(P.y - B.y, P.x - B.x); for (let i = -2; i <= 2; i++) eFire(B.x, B.y, a + i*.14, 330, 12, 6); sfx.eshot(); } }
  if (dist(B, P) < B.r + P.r) hurt(20, B.x, B.y);
}

/* ================= damage ================= */
function hurt(dmg, sx, sy){
  if (P.inv > 0 || game.state !== 'play' || L.finished) return;
  P.hp -= dmg; P.inv = .7; P.lastHit = 0; hurtFlash = .35; game.combo = 0; sfx.hurt(); shake(7, .25);
  const a = Math.atan2(P.y - sy, P.x - sx); P.x += Math.cos(a)*18; P.y += Math.sin(a)*18; pushOut(P);
  if (P.hp <= 0) die();
}

/* ---------- 1. Marais : brouillard + capture ---------- */
function mkMarais(){
  resetWorld(2600, 1900); border(30, 'wall');
  const orph = [[650,1150],[1250,480],[2000,1250],[1350,1560]].map(([x,y]) => ({x, y, p:0, done:false, cd:0, ph:Math.random()*6}));
  const gen = { x:2300, y:300, r:38, hp:110, max:110, alive:true, shield:true, flash:0, spawn:2 };
  const spawn = { x:250, y:1650 };
  const avoid = [[spawn.x,spawn.y],[gen.x,gen.y],...orph.map(o => [o.x,o.y])];
  const R = rng(11);
  for (let x = 120; x < WW - 100; x += 150) for (let y = 120; y < WH - 100; y += 150){
    const cx = x + (R()-.5)*90, cy = y + (R()-.5)*90; const v = R();
    if (avoid.some(([ax,ay]) => Math.hypot(cx - ax, cy - ay) < 200)) continue;
    if (v < .36) addOb({t:'c', x:cx, y:cy, r:18 + R()*18, k:'tree'});
    else if (v < .6) puddles.push({x:cx, y:cy, rx:70 + R()*60, ry:35 + R()*25});
  }
  let spawnT = 2.5;
  return {
    spawn, dark:440, gens:[gen], ground:'#0c110b', grid:'rgba(150,190,120,.035)',
    sticker: genericSticker(2450, 1750),
    intro:[
      ['bit', 'Le Marais du Presque-Fini : des projets abandonnés, et Lockware s’en nourrit.'],
      ['bit', 'Reste près d’un Orphelin pour le reprendre en main. Les quatre repris, le bouclier du générateur tombe.'],
      ['term', 'Le brouillard cache les bugs. La minimap montre les Orphelins.'],
    ],
    objective(){ const n = orph.filter(o => o.done).length; return n < 4 ? `Reprends les Orphelins <b>${n}/4</b>` : '<b>Détruis le générateur</b>'; },
    target(){ const o = orph.filter(o => !o.done).sort((a,b) => dist(a,P) - dist(b,P))[0]; return o || (gen.alive ? gen : null); },
    marks(){ const m = orph.map(o => ({x:o.x, y:o.y, c:o.done ? C.lime : C.fg})); if (gen.alive) m.push({x:gen.x, y:gen.y, c:C.red, s:6}); return m; },
    update(dt){
      let capturing = false;
      for (const o of orph){
        if (o.done){ o.cd -= dt; if (o.cd <= 0){ const e = nearestEnemy(o.x, o.y, 380, true); if (e){ fireFrom(o.x, o.y, Math.atan2(e.y - o.y, e.x - o.x), 1, 700, C.lime, .6, 't'); o.cd = .55; } } continue; }
        if (dist(o, P) < 100){ capturing = true; o.p += dt/6;
          if (o.p >= 1){ o.done = true; sfx.chime(); burst(o.x, o.y, 40); addScore(200); const n = orph.filter(q => q.done).length;
            bubble('bit', n < 4 ? `Orphelin repris, ${n} sur 4. Il tire pour nous maintenant !` : 'Les quatre Orphelins sont repris ! Le bouclier du générateur tombe.', 2600);
            if (n === 4){ gen.shield = false; sfx.alarm(); } } }
        else o.p = Math.max(0, o.p - dt/20);
      }
      spawnT -= dt; const cap = capturing ? 18 : 11;
      if (spawnT <= 0 && enemies.length < cap){ spawnT = capturing ? .75 : 2; spawnRing(P.x, P.y, 520, 680, pickW([['bug',5],['spam',3],['drone',1.2]])); if (capturing && Math.random() < .5) spawnRing(P.x, P.y, 520, 680, 'spam'); }
      if (gen.alive && !gen.shield && dist(gen, P) < 900){ gen.spawn -= dt; if (gen.spawn <= 0){ gen.spawn = 2.2; spawnRing(gen.x, gen.y, 90, 220, Math.random() < .35 ? 'legacy' : 'drone'); } }
    },
    onGen(){ finishLevel(); },
    drawMid(c, t){
      for (const o of orph){
        const x = o.x, y = o.y + Math.sin(t*1.5 + o.ph)*3;
        c.strokeStyle = o.done ? la(.3) : 'rgba(238,241,232,.12)'; c.lineWidth = 2; c.setLineDash([6,8]); c.beginPath(); c.arc(o.x, o.y, 100, 0, 6.283); c.stroke(); c.setLineDash([]);
        if (!o.done && o.p > 0){ c.strokeStyle = C.lime; c.lineWidth = 5; c.beginPath(); c.arc(o.x, o.y, 100, -Math.PI/2, -Math.PI/2 + 6.283*o.p); c.stroke(); }
        c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(x, y + 32, 34, 7, 0, 0, 6.283); c.fill();
        c.fillStyle = o.done ? '#1f2a10' : '#1d2119'; c.strokeStyle = o.done ? C.lime : '#4a5143'; c.lineWidth = 2; c.beginPath(); c.roundRect(x - 32, y - 26, 64, 52, 8); c.fill(); c.stroke();
        c.fillStyle = o.done ? C.lime : '#7d8474'; c.fillRect(x - 13, y - 7, 5, 8); c.fillRect(x + 8, y - 7, 5, 8);
        c.strokeStyle = o.done ? C.lime : '#7d8474'; c.lineWidth = 2; c.beginPath(); if (o.done) c.arc(x, y + 6, 7, Math.PI*.15, Math.PI*.85); else c.arc(x, y + 16, 7, Math.PI*1.15, Math.PI*1.85); c.stroke();
        c.fillStyle = o.done ? C.lime : C.muted; c.font = `700 11px ${MONO}`; c.textAlign = 'center'; c.fillText(o.done ? 'REPRIS' : 'ORPHELIN', x, y - 36); c.textAlign = 'left';
      }
    },
  };
}

/* ---------- 2. Gymnase : arène, vagues, combos ---------- */
function mkGym(){
  resetWorld(1800, 1300); border(30, 'wall');
  for (const [x,y] of [[430,330],[1300,330],[430,900],[1300,900],[865,230],[865,1000]]) addOb({t:'r', x, y, w:70, h:70, k:'pillar'});
  pads.push({x:560, y:610, w:680, h:80}, {x:860, y:380, w:80, h:540});
  const gates = [[900,90],[90,650],[1710,650],[900,1210]];
  const WAVES = [
    [['bug',10]],
    [['bug',8],['flaky',5]],
    [['drone',5],['bug',6],['flaky',4]],
    [['spam',16],['legacy',2],['flaky',4]],
    [['broken',1],['bug',6],['drone',3],['flaky',3]],
  ];
  let wave = 0, phase = 'pre', between = 2.2, queue = [], qT = 0, boss = null;
  return {
    spawn:{x:900, y:1100}, ground:'#0e100b', grid:'rgba(200,245,32,.035)',
    sticker: genericSticker(80, 80),
    intro:[
      ['rep', 'Bienvenue au Gymnase ! Cinq étapes de pipeline, cinq vagues. Green build or it didn’t happen !'],
      ['rep', 'Enchaîne les éliminations pour faire monter le multiplicateur. Les bandes vertes au sol te boostent.'],
      ['rep', 'Méfie-toi des tests flaky, les violets : ils se téléportent.'],
    ],
    objective(){ return phase === 'done' ? 'Build vert !' : `Étape <b>${wave + 1}/5</b> · ${enemies.length + queue.length} tests rouges`; },
    target(){ return null; },
    marks(){ return gates.map(([x,y]) => ({x, y, c:C.red, s:4})); },
    update(dt){
      if (phase === 'pre'){ between -= dt; if (between <= 0){ phase = 'wave'; queue = []; for (const [tp,n] of WAVES[wave]) for (let i = 0; i < n; i++) queue.push(tp); queue.sort(() => Math.random() - .5); if (queue.includes('broken')){ queue = queue.filter(q => q !== 'broken'); queue.unshift('broken'); }
          toast('rep', `Étape ${wave + 1}/5`, wave === 4 ? 'Le Build Cassé' : 'Vague entrante', '', 1500); sfx.alarm(); } }
      else if (phase === 'wave'){
        qT -= dt; if (qT <= 0 && queue.length){ qT = .38; const tp = queue.shift(), [gx,gy] = gates[Math.floor(Math.random()*4)]; const e = spawnEnemy(tp, gx, gy, {seen:true}); if (tp === 'broken'){ boss = e; bubble('rep', 'Le Build Cassé ! Tourne autour et tire sans t’arrêter !', 2600); } }
        if (!queue.length && !enemies.length){ wave++; sfx.chime(); addScore(150);
          if (wave >= 5){ phase = 'done'; finishLevel(); }
          else { phase = 'pre'; between = 2.6; bubble('rep', ['Étape verte ! Continue comme ça.','Deux sur cinq. Ta forme est bonne !','Trois ! Le pipeline tient.','Quatre ! Plus qu’une, et c’est la plus dure.'][wave - 1], 2200); } }
      }
    },
    drawScreen(c){
      const w = Math.min(320, vw() - 220), x = (vw() - w)/2, y = 16, sw = (w - 16)/5;
      c.fillStyle = 'rgba(9,10,8,.8)'; c.fillRect(x - 8, y - 6, w + 16, 30);
      for (let i = 0; i < 5; i++){ c.fillStyle = i < wave ? C.lime : i === wave ? `rgba(255,181,71,${.5 + .3*Math.sin(clock*5)})` : '#2a2e25'; c.fillRect(x + i*(sw + 4), y, sw, 8); }
      c.fillStyle = C.muted; c.font = `600 10px ${MONO}`; c.textAlign = 'center'; c.fillText('PIPELINE CI', vw()/2, y + 20); c.textAlign = 'left';
      if (boss && boss.hp > 0) bossBar(c, 'LE BUILD CASSÉ', boss.hp/boss.max);
    },
  };
}

/* ---------- 3. Ada-Lovelace : escorte ---------- */
function mkEscort(){
  resetWorld(3400, 1500); border(30, 'wall');
  const path = [[150,1200],[800,1200],[1100,520],[1900,520],[2300,1100],[3200,1100]];
  const segs = []; let total = 0;
  for (let i = 0; i < path.length - 1; i++){ const [x0,y0] = path[i], [x1,y1] = path[i+1], l = Math.hypot(x1 - x0, y1 - y0); segs.push({x0,y0,x1,y1,l,s:total}); total += l; }
  const at = s => { s = clamp(s, 0, total); for (const g of segs) if (s <= g.s + g.l){ const k = (s - g.s)/g.l; return { x:g.x0 + (g.x1 - g.x0)*k, y:g.y0 + (g.y1 - g.y0)*k, a:Math.atan2(g.y1 - g.y0, g.x1 - g.x0) }; } const g = segs[segs.length-1]; return { x:g.x1, y:g.y1, a:0 }; };
  const dPath = (x, y) => { let m = 1e9; for (const g of segs){ const vx = g.x1 - g.x0, vy = g.y1 - g.y0, k = clamp(((x - g.x0)*vx + (y - g.y0)*vy)/(g.l*g.l), 0, 1); m = Math.min(m, Math.hypot(x - (g.x0 + vx*k), y - (g.y0 + vy*k))); } return m; };
  const R = rng(33);
  for (let x = 100; x < WW - 80; x += 170) for (let y = 100; y < WH - 80; y += 170){
    const cx = x + (R()-.5)*40, cy = y + (R()-.5)*40;
    if (dPath(cx, cy) < 190 || Math.hypot(cx - 3200, cy - 1100) < 300 || Math.hypot(cx - 150, cy - 1200) < 250) continue;
    if (R() < .55){ const w = 70 + R()*60, h = 60 + R()*60; addOb({t:'r', x:cx - w/2, y:cy - h/2, w, h, k:'house', seed:Math.floor(R()*1e6)}); }
  }
  const bars = [.27, .55, .8].map(f => { const p = at(total*f); return { t:'r', x:p.x - 45, y:p.y - 45, w:90, h:90, k:'barricade', hp:30, max:30, alive:true, s:total*f }; });
  for (const b of bars) dyn.push(b);
  const truck = { s:0, x:path[0][0], y:path[0][1], a:0, r:32, hp:320, max:320, why:'' };
  let spawnT = 2, arrived = false;
  return {
    spawn:{x:120, y:1300}, ground:'#100e0a', grid:'rgba(255,181,71,.03)', truck,
    sticker: genericSticker(3250, 120),
    respawn(){ const p = at(Math.max(0, truck.s - 120)); return {x:p.x, y:p.y + 60}; },
    intro:[
      ['atlas', 'La cantine libre doit rejoindre l’école Ada-Lovelace. Je t’attends au bout de la route.'],
      ['term', 'Escorte le camion. Il s’arrête si des bugs l’entourent, ou si tu t’éloignes trop.'],
      ['term', 'Les barricades Lockware bloquent la route : tire dessus pour passer.'],
    ],
    objective(){ return `Escorte la cantine · <b>${Math.floor(truck.s/total*100)} %</b>${truck.why ? ' · ' + truck.why : ''}`; },
    target(){ const b = bars.find(b => b.alive && b.s > truck.s); if (dist(truck, P) > 450) return truck; return b ? {x:b.x + 45, y:b.y + 45} : {x:3200, y:1100}; },
    marks(){ const m = [{x:truck.x, y:truck.y, c:C.amber, s:6}, {x:3200, y:1100, c:C.lime, s:6}]; for (const b of bars) if (b.alive) m.push({x:b.x + 45, y:b.y + 45, c:C.red, s:5}); return m; },
    enemyTarget(e){ return dist(e, truck) < dist(e, P) ? truck : P; },
    damageTarget(t, dmg){ truck.hp -= dmg; truck.hitT = .15; if (truck.hp <= 0) failLevel('La cantine n’est jamais arrivée à l’école.'); },
    ebHit(b){ if (Math.hypot(b.x - truck.x, b.y - truck.y) < 34){ this.damageTarget(truck, b.dmg); return true; } return false; },
    update(dt){
      truck.hitT = Math.max(0, (truck.hitT || 0) - dt);
      const crowd = enemies.filter(e => dist(e, truck) < 150).length;
      const bar = bars.find(b => b.alive && b.s - truck.s > 0 && b.s - truck.s < 120);
      truck.why = bar ? 'barricade' : crowd >= 2 ? 'camion bloqué' : dist(P, truck) > 520 ? 'le camion t’attend' : '';
      if (!truck.why && !arrived){ truck.s += 80*dt; }
      const p = at(truck.s); truck.x = p.x; truck.y = p.y; truck.a = p.a;
      if (!arrived && truck.s >= total){ arrived = true; finishLevel(); }
      spawnT -= dt;
      if (spawnT <= 0 && enemies.length < 15){ spawnT = 1.6; const ahead = at(truck.s + 400); const tp = pickW([['bug',6],['drone',2.5],['legacy',truck.s > total*.4 ? 1.5 : .3],['spam',2]]); spawnRing(ahead.x, ahead.y, 300, 520, tp, {seen:true}); }
      if (truck.hp < truck.max) truck.hp = Math.min(truck.max, truck.hp + 1.5*dt);
    },
    onBar(){ sfx.boom(); bubble('atlas', 'Barricade tombée. La route est libre.', 1800); addScore(150); },
    drawFloor(c){
      c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#17150f'; c.lineWidth = 120; c.beginPath(); c.moveTo(path[0][0], path[0][1]); for (const [x,y] of path.slice(1)) c.lineTo(x, y); c.stroke();
      c.strokeStyle = 'rgba(255,181,71,.25)'; c.lineWidth = 3; c.setLineDash([26, 22]); c.stroke(); c.setLineDash([]); c.lineCap = 'butt';
      c.fillStyle = '#1d1810'; c.fillRect(3120, 940, 200, 110); c.strokeStyle = C.amber; c.lineWidth = 2; c.strokeRect(3120, 940, 200, 110);
      c.fillStyle = C.amber; c.font = `700 12px ${MONO}`; c.textAlign = 'center'; c.fillText('ÉCOLE ADA-LOVELACE', 3220, 930); c.textAlign = 'left';
      for (let i = 0; i < 8; i++){ c.fillStyle = arrived ? 'rgba(255,181,71,.85)' : '#3a3220'; c.fillRect(3135 + i*23, 960, 12, 12); c.fillRect(3135 + i*23, 1010, 12, 12); }
    },
    drawMid(c){
      c.save(); c.translate(truck.x, truck.y); c.rotate(truck.a);
      c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(-34, -16, 76, 42);
      c.fillStyle = truck.hitT > 0 ? '#fff' : '#20280f'; c.strokeStyle = C.lime; c.lineWidth = 2; c.beginPath(); c.roundRect(-40, -20, 60, 40, 4); c.fill(); c.stroke();
      c.fillStyle = '#2c3519'; c.beginPath(); c.roundRect(22, -17, 20, 34, 4); c.fill(); c.stroke();
      c.fillStyle = C.lime; c.font = `800 9px ${MONO}`; c.textAlign = 'center'; c.fillText('CANTINE', -10, -2); c.fillText('LIBRE', -10, 9); c.textAlign = 'left';
      c.restore();
      c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(truck.x - 36, truck.y - 46, 72, 6); c.fillStyle = truck.hp/truck.max < .3 ? C.red : C.amber; c.fillRect(truck.x - 36, truck.y - 46, 72*truck.hp/truck.max, 6);
      if (truck.why){ c.fillStyle = truck.why === 'barricade' || truck.why === 'camion bloqué' ? C.red : C.muted; c.font = `700 11px ${MONO}`; c.textAlign = 'center'; c.fillText(truck.why.toUpperCase(), truck.x, truck.y - 54); c.textAlign = 'left'; }
      if (!arrived){ c.save(); c.translate(3220, 1130); drawFaceSprite(c, 'atlas', 24); c.restore(); }
    },
  };
}

/* ---------- 4. Tour : infiltration dans le noir ---------- */
function mkStealth(){
  const S = 180, MW = 13, MH = 10;
  resetWorld(MW*S, MH*S); border(24, 'mwall');
  const R = rng(4242);
  const right = [], bottom = [], seen = [];
  for (let y = 0; y < MH; y++){ right.push(Array(MW).fill(true)); bottom.push(Array(MW).fill(true)); seen.push(Array(MW).fill(false)); }
  const stack = [[0, MH-1]]; seen[MH-1][0] = true;
  while (stack.length){
    const [cx, cy] = stack[stack.length - 1];
    const nb = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x,y]) => x >= 0 && y >= 0 && x < MW && y < MH && !seen[y][x]);
    if (!nb.length){ stack.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(R()*nb.length)];
    if (dx === 1) right[cy][cx] = false; if (dx === -1) right[cy][nx] = false; if (dy === 1) bottom[cy][cx] = false; if (dy === -1) bottom[ny][cx] = false;
    seen[ny][nx] = true; stack.push([nx, ny]);
  }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++){ if (R() < .18) right[y][x] = false; if (R() < .18) bottom[y][x] = false; }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++){
    if (right[y][x] && x < MW - 1) addOb({t:'r', x:(x+1)*S - 12, y:y*S - 12, w:24, h:S + 24, k:'mwall'});
    if (bottom[y][x] && y < MH - 1) addOb({t:'r', x:x*S - 12, y:(y+1)*S - 12, w:S + 24, h:24, k:'mwall'});
  }
  const cc = (x, y) => ({ x:x*S + S/2, y:y*S + S/2 });
  const keysL = [[11,8],[2,1],[7,4]].map(([x,y]) => ({ ...cc(x,y), got:false, txt:['CVE connue, jamais corrigée depuis 2019.','Mot de passe admin par défaut.','Port de débogage ouvert sur Internet.'] }));
  keysL.forEach((k,i) => k.txt = k.txt[i]);
  const vault = cc(12, 0);
  const sents = [[3,8],[5,6],[8,8],[10,5],[4,3],[7,1],[10,2],[1,5],[12,7],[6,2]].map(([x,y],i) => ({ ...cc(x,y), a:R()*6.28, sp:(i % 2 ? -1 : 1)*(.6 + R()*.4), poly:[] }));
  for (const [x,y] of [[4,9],[9,6],[2,4],[8,3],[11,1],[5,0]]) spawnEnemy('bug', cc(x,y).x, cc(x,y).y);
  let got = 0, alarm = 0, sirenT = 0, alarmSpawn = 0, nag = 0, spotted = 0;
  const RAD = 300, HALF = .38;
  return {
    spawn:cc(0, MH-1), dark:300, ghostDash:true, ground:'#0b0c0b', grid:'rgba(238,241,232,.02)', hpScale:1,
    sticker: genericSticker(cc(12,9).x, cc(12,9).y),
    intro:[
      ['null', 'Les étages de la tour Lockware. Tout est plongé dans le noir, et les projecteurs repèrent tout.'],
      ['null', 'Trouve les trois failles, puis rejoins le coffre en haut à droite.'],
      ['null', 'Ton esquive te rend invisible un instant. Les projecteurs ne voient rien pendant ce temps.'],
    ],
    objective(){ return got < 3 ? `Failles <b>${got}/3</b>${alarm > 0 ? ' · ALARME' : ''}` : '<b>Rejoins le coffre</b>'; },
    target(){ const k = keysL.filter(k => !k.got).sort((a,b) => dist(a,P) - dist(b,P))[0]; return k || vault; },

/* ---------- 5. Strata : défense + boss ---------- */
function mkStrata(){

  for (let x = 140; x < WW - 120; x += 160) for (let y = 140; y < WH - 120; y += 160){
    const cx = x + (R()-.5)*50, cy = y + (R()-.5)*50;
    if (Math.hypot(cx - core.x, cy - core.y) < 380) continue;
    if (gates.some(([gx,gy]) => { const vx = core.x - gx, vy = core.y - gy, l = Math.hypot(vx, vy), k = clamp(((cx - gx)*vx + (cy - gy)*vy)/(l*l), 0, 1); return Math.hypot(cx - (gx + vx*k), cy - (gy + vy*k)) < 130; })) continue;
    if (cy < 700 && Math.abs(cx - 1100) < 600) continue;

  }
  let phase = 'def', timer = 70, spawnT = 1.5, el = 0;
  return {
    spawn:{x:1100, y:1080}, ground:'#0b0f11', grid:'rgba(143,211,255,.04)', core,
    sticker: genericSticker(1100, 1600),
    intro:[
      ['brick', 'Le chantier Strata. La carte libre de la ville est presque prête, il ne manque que la release.'],
      ['brick', 'Lockware envoie tout ce qu’il a. Tiens 70 secondes. Touche E pour poser des tourelles, quatre au maximum.'],
      ['atlas', 'Protège le cœur de Strata. One block at a time.'],
    ],
    respawn(){ return {x:core.x, y:core.y + 120}; },
    objective(){ return phase === 'def' ? `Protège Strata · <b>${Math.ceil(timer)} s</b>` : '<b>Brise le cadenas de Lockware</b>'; },
    target(){ return phase === 'boss' ? game.boss : (dist(P, core) > 600 ? core : null); },
    marks(){ return [{x:core.x, y:core.y, c:C.blue, s:7}, ...gates.map(([x,y]) => ({x, y, c:C.red, s:4}))]; },
    enemyTarget(e){ return phase === 'def' && dist(e, P) > 230 ? core : P; },
    damageTarget(t, dmg){ if (core.shield) return; core.hp -= dmg; core.hitT = .12; if (core.hp <= 0) failLevel('Le cœur de Strata est tombé.'); },
    ebHit(b){ if (!core.shield && Math.hypot(b.x - core.x, b.y - core.y) < core.r){ this.damageTarget(core, b.dmg); return true; } return false; },
    update(dt){
      core.hitT = Math.max(0, (core.hitT || 0) - dt);

        timer -= dt; el += dt; spawnT -= dt;

          spawnEnemy(pickW([['bug',6],['spam',el > 15 ? 4 : 1],['drone',2],['flaky',el > 25 ? 2 : 0],['legacy',el > 35 ? 1.6 : .3]]), gx, gy, {seen:true}); }
        if (timer <= 20 && !this.warned){ this.warned = true; bubble('brick', 'Vingt secondes ! Tiens bon !', 1800); }
        if (timer <= 0){ phase = 'boss'; core.shield = true;

    },

    drawMid(c, t){
      c.save(); c.translate(core.x, core.y);
      if (core.shield){ c.strokeStyle = `rgba(143,211,255,${.4 + .2*Math.sin(t*4)})`; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 92, 0, 6.283); c.stroke(); }
      const hx = (i, r) => [Math.cos(i/6*6.283 - Math.PI/2)*r, Math.sin(i/6*6.283 - Math.PI/2)*r];
      c.fillStyle = core.hitT > 0 ? '#fff' : '#132028'; c.strokeStyle = C.blue; c.lineWidth = 3; c.beginPath(); for (let i = 0; i < 6; i++) c.lineTo(...hx(i, 64)); c.closePath(); c.fill(); c.stroke();
      for (let k = 0; k < 3; k++){ c.strokeStyle = `rgba(143,211,255,${.25 + k*.15})`; c.lineWidth = 2; c.beginPath(); c.moveTo(-34, -14 + k*14); c.lineTo(0, -28 + k*14); c.lineTo(34, -14 + k*14); c.lineTo(0, 0 + k*14); c.closePath(); c.stroke(); }
      c.fillStyle = C.blue; c.font = `800 11px ${MONO}`; c.textAlign = 'center'; c.fillText('STRATA', 0, 48); c.textAlign = 'left';

/* ================= level flow ================= */
let miniBase = null, miniFit = null;
function buildMiniBase(){
  const c = document.createElement('canvas'); c.width = 360; c.height = 260; const g = c.getContext('2d');
  const s = Math.min(360/WW, 260/WH), ox = (360 - WW*s)/2, oy = (260 - WH*s)/2; miniFit = {s, ox, oy};
  g.fillStyle = '#0a0b09'; g.fillRect(0, 0, 360, 260); g.fillStyle = '#151812'; g.fillRect(ox, oy, WW*s, WH*s);
  g.fillStyle = '#2f342a';
  for (const o of obstacles){ if (o.t === 'r') g.fillRect(ox + o.x*s, oy + o.y*s, Math.max(1, o.w*s), Math.max(1, o.h*s)); else { g.beginPath(); g.arc(ox + o.x*s, oy + o.y*s, Math.max(1, o.r*s), 0, 6.283); g.fill(); } }
  miniBase = c;
}
function startLevel(i){
  clearBubbles(); fx.innerHTML = '';

  P.perks = new Set(); for (let k = 0; k < i; k++) P.perks.add(LEVELS[k].crew); if (i === 4) P.perks.add('brick');
  P.max = P.perks.has('atlas') ? 160 : 100; P.hp = P.max; P.x = L.spawn.x; P.y = L.spawn.y; P.inv = 1; P.ghost = 0; P.dash = 0; P.dashCd = 0; P.turCd = 0; P.ang = -Math.PI/2;
  cam.x = P.x; cam.y = P.y; clampCam(); buildMiniBase(); renderCrewbar(); objCache = '';
  hideMenu(); $('#hudov').hidden = false; game.state = 'intro';

  fx.appendChild(card); live(`Niveau ${i + 1} : ${d.name}`); sfx.chime();
  setTimeout(() => { card.classList.add('out'); setTimeout(() => card.remove(), 320); if (game.state === 'intro'){ game.state = 'play'; last = performance.now(); cv.classList.add('aim'); for (const [w,t] of L.intro) bubble(w, t, 3600); if (i === 4) toast('brick', 'BRICK rejoint l’équipage', PERKS.brick[0], PERKS.brick[1], 2600); } }, 2200);
}
function finishLevel(final=false){

function respawn(){
  const s = L.respawn ? L.respawn() : L.spawn; const f = freeSpot(s.x, s.y, P.r, 60) || s;
  P.x = f.x; P.y = f.y; P.hp = P.max; P.inv = 2; game.score = Math.max(0, game.score - 150);

/* ================= update ================= */
function update(dt){
  game.lt += dt;
  if (game.comboT > 0){ game.comboT -= dt; if (game.comboT <= 0) game.combo = 0; }
  const [mx, my] = moveVec();
  let sp = 255;
  if (puddles.some(p => ((P.x - p.x)/p.rx)**2 + ((P.y - p.y)/p.ry)**2 < 1)) sp *= .6;
  if (pads.some(p => P.x > p.x && P.x < p.x + p.w && P.y > p.y && P.y < p.y + p.h)){ sp *= 1.55; if (!RM && Math.random() < .4) parts.push({x:P.x, y:P.y, vx:0, vy:0, t:0, l:.3, c:la(.5), s:6}); }
  if (P.dash > 0){ P.dash -= dt; P.x += P.dx*780*dt; P.y += P.dy*780*dt; if (!RM && Math.random() < .7) parts.push({x:P.x, y:P.y, vx:0, vy:0, t:0, l:.25, c:P.ghost > 0 ? 'rgba(196,155,255,.5)' : la(.5), s:10}); }
  else { P.x += mx*sp*dt; P.y += my*sp*dt; }
  pushOut(P);
  P.dashCd -= dt; P.inv -= dt; P.ghost -= dt; P.lastHit += dt; P.turCd -= dt;
  const regen = P.perks.has('atlas') ? 12 : 5; if (P.lastHit > 3.5 && P.hp < P.max) P.hp = Math.min(P.max, P.hp + regen*dt);
  // aim & fire
  let firing = false;
  if (sticks.aim){ const dx = sticks.aim.x - sticks.aim.ox, dy = sticks.aim.y - sticks.aim.oy; if (Math.hypot(dx, dy) > 10) P.ang = Math.atan2(dy, dx); firing = true; }
  else if (mouse.used && mouse.inside){ const [wx, wy] = toWorld(mouse.sx, mouse.sy); P.ang = Math.atan2(wy - P.y, wx - P.x); firing = mouse.down; }
  if (!sticks.aim && (game.autofire || !mouse.used)){ const t = nearestEnemy(P.x, P.y, 520); if (t){ P.ang = Math.atan2(t.y - P.y, t.x - P.x); if (game.autofire || COARSE.matches) firing = true; } }
  P.fire -= dt;
  if (firing && P.fire <= 0){
    P.fire = P.perks.has('rep') ? .082 : .14;
    const ox = P.x + Math.cos(P.ang)*18, oy = P.y + Math.sin(P.ang)*18;
    if (P.perks.has('bit')){ fireFrom(ox, oy, P.ang - .16); fireFrom(ox, oy, P.ang); fireFrom(ox, oy, P.ang + .16); } else fireFrom(ox, oy, P.ang);
    sfx.shot();
  }
  // brax
  brax.a += dt*2.2; brax.x = P.x + Math.cos(brax.a)*42; brax.y = P.y + Math.sin(brax.a)*42; brax.cd -= dt;
  if (brax.cd <= 0){ const t = nearestEnemy(brax.x, brax.y, 380); if (t){ fireFrom(brax.x, brax.y, Math.atan2(t.y - brax.y, t.x - brax.x), 1, 700, '#eef1e8', .6, 'b'); brax.cd = .65; } }
  // turrets
  for (let i = turrets.length - 1; i >= 0; i--){ const t = turrets[i]; t.t -= dt; t.cd -= dt; if (t.t <= 0){ burst(t.x, t.y, 12, C.muted); turrets.splice(i, 1); continue; }
    const e = nearestEnemy(t.x, t.y, 440); if (e){ t.a = Math.atan2(e.y - t.y, e.x - t.x); if (t.cd <= 0){ t.cd = .22; fireFrom(t.x + Math.cos(t.a)*16, t.y + Math.sin(t.a)*16, t.a, 1, 760, C.blue, .6, 't'); } } }
  if (!L.finished) L.update(dt);
  if (game.state !== 'play') return;
  // enemies
  for (const e of enemies){
    e.hit = Math.max(0, e.hit - dt); e.cd -= dt; e.cd2 -= dt; e.wob += dt;
    const tg = eTarget(e);
    const dx = tg.x - e.x, dy = tg.y - e.y, d = Math.hypot(dx, dy) || 1;
    const dp = dist(e, P);
    if (dp < 480) e.seen = true;
    const aggro = e.seen || dp < 600;
    let vx = 0, vy = 0;
    if (e.type === 'drone'){
      if (aggro){ const want = d > 300 ? 1 : d < 220 ? -1 : 0; vx = dx/d*want + (-dy/d)*.6; vy = dy/d*want + (dx/d)*.6;

  } else if (e.type === 'legacy'){
    c.rotate(a); c.fillStyle = e.hit > 0 ? '#fff' : '#5a1f1a'; c.strokeStyle = '#c0473c'; c.lineWidth = 3; c.beginPath(); c.roundRect(-28, -24, 56, 48, 8); c.fill(); c.stroke();
    c.rotate(-a); c.fillStyle = '#ff9a90'; c.font = `800 10px ${MONO}`; c.textAlign = 'center'; c.fillText('LEGACY', 0, 4); c.textAlign = 'left';
  } else {
    c.rotate(t*.8); c.fillStyle = e.hit > 0 ? '#fff' : '#3b1210'; c.strokeStyle = C.red; c.lineWidth = 4; c.beginPath(); for (let i = 0; i < 8; i++){ const r = i % 2 ? 34 : 46, an = i/8*6.283; c.lineTo(Math.cos(an)*r, Math.sin(an)*r); } c.closePath(); c.fill(); c.stroke();
    c.rotate(-t*.8); c.fillStyle = C.red; c.font = `800 18px ${MONO}`; c.textAlign = 'center'; c.fillText('✗', 0, 7); c.textAlign = 'left';
  }
  c.restore();
  if (e.hp < e.max && e.type !== 'broken'){ c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(e.x - 16, e.y - e.r - 12, 32, 4); c.fillStyle = C.red; c.fillRect(e.x - 16, e.y - e.r - 12, 32*e.hp/e.max, 4); }
}
function drawBoss(c, B, t){
  c.save(); c.translate(B.x, B.y);
  for (let i = 0; i < 3; i++){ c.save(); c.rotate((i % 2 ? -1 : 1)*t*(.6 + i*.2)); c.strokeStyle = `rgba(255,93,79,${.25 + i*.1})`; c.lineWidth = 6; c.setLineDash([20 + i*6, 10]); c.beginPath(); c.arc(0, 0, 84 + i*18, 0, 6.283); c.stroke(); c.restore(); }
  c.setLineDash([]);
  c.strokeStyle = B.flash > 0 ? '#fff' : '#8a9182'; c.lineWidth = 14; c.beginPath(); c.arc(0, -30, 36, Math.PI, 0); c.lineTo(36, -6); c.moveTo(-36, -30); c.lineTo(-36, -6); c.stroke();
  c.fillStyle = B.flash > 0 ? '#fff' : '#2b2e28'; c.strokeStyle = '#8a9182'; c.lineWidth = 4; c.beginPath(); c.roundRect(-56, -10, 112, 84, 8); c.fill(); c.stroke();
  const pul = .5 + .5*Math.sin(t*6); c.fillStyle = `rgba(255,93,79,${.6 + .4*pul})`; c.beginPath(); c.arc(0, 22, 12, 0, 6.283); c.fill(); c.beginPath(); c.moveTo(-7, 26); c.lineTo(7, 26); c.lineTo(10, 54); c.lineTo(-10, 54); c.closePath(); c.fill();
  c.fillStyle = '#8a9182'; c.font = `800 11px ${MONO}`; c.textAlign = 'center'; c.fillText('LOCKWARE', 0, 68); c.textAlign = 'left';
  c.restore();
}
function drawPlayer(c, t){
  c.save(); c.translate(P.x, P.y);
  if (P.ghost > 0) c.globalAlpha = .45; else if (P.inv > 0 && P.dash <= 0 && Math.floor(t*14) % 2) c.globalAlpha = .4;
  c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(4, 8, 16, 8, 0, 0, 6.283); c.fill();
  c.rotate(P.ang + Math.PI/2);
  const col = P.ghost > 0 ? C.violet : C.lime;
  c.shadowColor = col; c.shadowBlur = RM ? 0 : 14;
  c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.moveTo(-7,-14); c.lineTo(-14,-14); c.lineTo(-14,14); c.lineTo(-7,14); c.moveTo(7,-14); c.lineTo(14,-14); c.lineTo(14,14); c.lineTo(7,14); c.stroke();
  c.shadowBlur = 0; c.fillStyle = col; c.fillRect(-2, -22, 4, 10);
  c.fillStyle = C.fg; c.fillRect(-6, -4, 3, 5); c.fillRect(3, -4, 3, 5);
  c.restore();
}
function drawScreen(c, t){
  const target = L.target && L.target();
  if (target && !L.finished){
    const sx = (target.x - cam.x)*cam.z + vw()/2, sy = (target.y - cam.y)*cam.z + vh()/2, m = 46;
    if (sx < m || sy < m || sx > vw() - m || sy > vh() - m){
      const a = Math.atan2(sy - vh()/2, sx - vw()/2), ex = clamp(vw()/2 + Math.cos(a)*vw(), m, vw() - m), ey = clamp(vh()/2 + Math.sin(a)*vh(), m + 20, vh() - m);
      c.save(); c.translate(ex, ey); c.rotate(a); c.fillStyle = C.lime; c.globalAlpha = .7 + .3*Math.sin(t*5); c.beginPath(); c.moveTo(16, 0); c.lineTo(-8, -11); c.lineTo(-3, 0); c.lineTo(-8, 11); c.closePath(); c.fill(); c.restore();
    }
  }
  L.drawScreen && L.drawScreen(c, t);
  const B = game.boss; if (B && B.hp > 0) bossBar(c, 'LOCKWARE · LICENCE PROPRIÉTAIRE', B.hp/B.max);
  for (const s of ['move','aim']) if (sticks[s]){ const k = sticks[s]; c.strokeStyle = la(.35); c.lineWidth = 2; c.beginPath(); c.arc(k.ox, k.oy, 50, 0, 6.283); c.stroke(); const dx = k.x - k.ox, dy = k.y - k.oy, l = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx); c.fillStyle = la(.5); c.beginPath(); c.arc(k.ox + Math.cos(a)*l, k.oy + Math.sin(a)*l, 20, 0, 6.283); c.fill(); }
  if (mouse.inside && mouse.used && game.state === 'play'){ c.strokeStyle = C.lime; c.lineWidth = 2; const x = mouse.sx, y = mouse.sy; c.beginPath(); c.moveTo(x - 12, y); c.lineTo(x - 5, y); c.moveTo(x + 5, y); c.lineTo(x + 12, y); c.moveTo(x, y - 12); c.lineTo(x, y - 5); c.moveTo(x, y + 5); c.lineTo(x, y + 12); c.stroke(); }
  if (hurtFlash > 0 && !RM){ const g = c.createRadialGradient(vw()/2, vh()/2, Math.min(vw(), vh())*.3, vw()/2, vh()/2, Math.max(vw(), vh())*.7); g.addColorStop(0, 'rgba(255,93,79,0)'); g.addColorStop(1, `rgba(255,93,79,${hurtFlash})`); c.fillStyle = g; c.fillRect(0, 0, vw(), vh()); }
  if (P.hp/P.max < .3 && game.state === 'play'){ c.strokeStyle = `rgba(255,93,79,${.3 + .2*Math.sin(t*6)})`; c.lineWidth = 6; c.strokeRect(3, 3, vw() - 6, vh() - 6); }
}
let miniT = 0;
function drawMini(){
  if (!miniBase) return;
  const c = mctx, {s, ox, oy} = miniFit;
  c.drawImage(miniBase, 0, 0);
  for (const m of L.marks()){ c.fillStyle = m.c; const r = m.s || 4; c.fillRect(ox + m.x*s - r/2, oy + m.y*s - r/2, r, r); }
  if (L.def.id !== 'tour'){ c.fillStyle = 'rgba(255,93,79,.75)'; for (const e of enemies) c.fillRect(ox + e.x*s - 1, oy + e.y*s - 1, 2, 2); }
  if (game.boss && game.boss.hp > 0){ c.fillStyle = C.red; c.fillRect(ox + game.boss.x*s - 4, oy + game.boss.y*s - 4, 8, 8); }
  const hw = vw()/2/cam.z, hh = vh()/2/cam.z; c.strokeStyle = 'rgba(238,241,232,.3)'; c.lineWidth = 1; c.strokeRect(ox + (cam.x - hw)*s, oy + (cam.y - hh)*s, hw*2*s, hh*2*s);
  c.save(); c.translate(ox + P.x*s, oy + P.y*s); c.rotate(P.ang); c.fillStyle = C.lime; c.beginPath(); c.moveTo(7, 0); c.lineTo(-5, -5); c.lineTo(-5, 5); c.closePath(); c.fill(); c.restore();
}
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; clock += dt;
  if (game.state === 'play') update(dt);
  else if (game.state === 'title'){ cam.x = WW/2 + Math.cos(clock*.08)*WW*.3; cam.y = WH/2 + Math.sin(clock*.11)*WH*.25; clampCam(); }
  else stepFx(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#070806'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (L){
    let ox = 0, oy = 0; if (shakeT > 0 && game.state === 'play'){ ox = (Math.random()-.5)*shakeA; oy = (Math.random()-.5)*shakeA; }
    const k = dpr*cam.z;
    ctx.setTransform(k, 0, 0, k, dpr*(vw()/2 - cam.x*cam.z + ox), dpr*(vh()/2 - cam.y*cam.z + oy));
    drawWorld(ctx, clock);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (['play','pause','dead','intro'].includes(game.state)) drawScreen(ctx, clock);
    if (game.state === 'play'){ updateHud(); miniT -= dt; if (miniT <= 0){ miniT = .1; drawMini(); } }
  }
  requestAnimationFrame(frame);
}

/* ================= menus ================= */
function showMenu(html){ menu.innerHTML = html; cv.classList.remove('aim'); }
function hideMenu(){ menu.innerHTML = ''; cv.classList.add('aim'); }
function title(){
  game.state = 'title'; clearBubbles(); fx.innerHTML = ''; $('#hudov').hidden = true; $('#obj').textContent = 'The Locked World'; $('#timer').textContent = '00:00';
  L = mkMarais(); L.def = LEVELS[0]; enemies = []; game.boss = null;
  save = loadSave();
  const next = Math.min(save.unlocked, 4), nStk = Object.keys(save.stickers).length;
  showMenu(`<section class="menu"><div class="m-in wide">
    <p class="eyebrow">${faceSVG('brax')} Solid Geeks présente</p>
    <h1>The Locked World<span class="cur">_</span></h1>
    <p class="lede">Lockware verrouille la ville. Cinq niveaux, cinq façons de jouer, et à chaque victoire un membre de l’équipage te rejoint avec un nouveau pouvoir.</p>
    <ol class="levels">${LEVELS.map((d,i) => { const b = save.best[d.id], open = i <= save.unlocked;
      return `<li><button class="lv ${b ? 'done' : ''}" data-i="${i}" ${open ? '' : 'disabled'} aria-label="Niveau ${i + 1}, ${d.name}${open ? '' : ', verrouillé'}"><span class="top"><span class="num">${i + 1}</span>${faceSVG(d.crew)}</span><b>${d.short}</b><span class="tg">${d.tag}</span><span class="bs">${b ? `${b.score} pts · ${fmt(b.time)}` : open ? 'à jouer' : 'verrouillé'}</span></button></li>`; }).join('')}</ol>
    <div class="acts"><button class="btn" id="play">${save.unlocked > 0 ? `Continuer · niveau ${next + 1}` : 'Jouer'}</button><a class="btn ghost" href="${LINKS.site}" target="_blank" rel="noopener">La communauté</a></div>
    <dl class="keys">
      <dt><kbd>ZQSD</kbd> <kbd>WASD</kbd> <kbd>↑↓←→</kbd></dt><dd>se déplacer</dd>
      <dt>souris + clic maintenu</dt><dd>viser et tirer · <kbd>F</kbd> visée auto</dd>
      <dt><kbd>Espace</kbd> · <kbd>E</kbd> · <kbd>P</kbd></dt><dd>esquive · tourelle (niveau 5) · pause</dd>
      <dt>tactile</dt><dd>pouce gauche pour bouger, pouce droit pour viser</dd>
    </dl>
    <div class="opts"><label><input type="checkbox" id="optSound" ${muted ? '' : 'checked'}> Son et musique</label><label><input type="checkbox" id="optRm" ${RM ? 'checked' : ''}> Mouvements réduits</label><span>Stickers Brax : ${nStk}/5</span></div>
  </div></section>`);
  const go = i => { ac(); RM = $('#optRm').checked; setMuted(!$('#optSound').checked); game.run = { score:0, time:0, kills:0, deaths:0 }; startLevel(i); };
  $('#play').addEventListener('click', () => go(next));
  menu.querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#play').focus({preventScroll:true});
}
function pause(){
  if (game.state !== 'play') return; game.state = 'pause'; keys.clear(); mouse.down = false; sticks.move = sticks.aim = null;
  showMenu(`<div class="menu center"><div class="m-in"><p class="eyebrow">Pause · niveau ${game.idx + 1}/5</p><h2>${LEVELS[game.idx].short} <em>attend</em>.</h2><p class="lede">${L.objective().replace(/<[^>]+>/g, '')} · score ${game.score} · ${fmt(game.lt)}</p><div class="acts"><button class="btn" id="resume">Reprendre</button><button class="btn ghost" id="restart">Recommencer le niveau</button><button class="btn ghost" id="tomenu">Menu</button></div></div></div>`);
  $('#resume').addEventListener('click', resume); $('#restart').addEventListener('click', () => startLevel(game.idx)); $('#tomenu').addEventListener('click', title); $('#resume').focus();
}
function resume(){ hideMenu(); game.state = 'play'; last = performance.now(); }
function showFinal(){
  const r = game.run;
  showMenu(`<div class="menu center"><div class="m-in">
    <p class="eyebrow">${faceSVG('brax')} Release v1.0 · signée</p>
    <h2>La ville est <em>ouverte</em>.</h2>
    <p class="lede">Lockware est tombé et l’équipage est au complet. À toi de faire pareil pour de vrai : dis bonjour, choisis une good first issue, signe ton commit avec <b>git commit -s</b>.</p>
    <dl class="endstats"><div><dt>Score de la partie</dt><dd>${r.score}</dd></div><div><dt>Temps</dt><dd>${fmt(r.time)}</dd></div><div><dt>Bugs écrasés</dt><dd>${r.kills}</dd></div><div><dt>Stickers</dt><dd>${Object.keys(save.stickers).length}/5</dd></div><div><dt>Builds rouges</dt><dd>${r.deaths}</dd></div></dl>
    <div class="acts"><a class="btn" href="${LINKS.discord}" target="_blank" rel="noopener">Dire bonjour sur Discord</a><a class="btn ghost" href="${LINKS.github}" target="_blank" rel="noopener">GitHub</a><a class="btn ghost" href="${LINKS.site}" target="_blank" rel="noopener">La communauté</a><button class="btn ghost" id="tomenu">Menu</button></div>
  </div></div>`);
  $('#tomenu').addEventListener('click', title);
  live('Victoire. La ville est ouverte.');
}

renderCrewbar(); title(); requestAnimationFrame(frame);
})();
</script>
